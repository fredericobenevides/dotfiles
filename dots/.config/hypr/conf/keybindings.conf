# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more

# Applications
bind = $mainMod, Return, exec, $terminal                                                        # Open terminal
bind = $mainMod, b, exec, $browser                                                              # Open browser
bind = $mainMod, E, exec, $fileManager                                                          # Open fileManager
bind = $mainMod, SPACE, exec, rofi -modi drun -show drun -config ~/.config/rofi/rofidmenu.rasi  # Open menu
bind = $mainMod, C, exec, $colorPicker                                                          # Open color picker

# Windows
bind = $mainMod, Q, killactive                                                                  # Kill active window
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill     # Quit active window and all open instances
bind = $mainMod, F, fullscreen, 1                                                               # Set active window to fullscreen
bind = $mainMod SHIFT, F, fullscreen, 0                                                         # Maximize Window
bind = $mainMod SHIFT, E, exit                                                                  # Quit from Hyprland
bind = $mainMod, T, togglefloating                                                              # Toggle active windows into floating mode
bind = $mainMod SHIFT, T, workspaceopt, allfloat                                                # Toggle all windows into floating mode
bind = $mainMod, J, togglesplit                                                                 # Toggle split
bind = $mainMod, K, swapsplit                                                                   # Swapsplit
bind = $mainMod ALT, left, swapwindow, l                                                        # Swap tiled window left
bind = $mainMod ALT, right, swapwindow, r                                                       # Swap tiled window right
bind = $mainMod ALT, up, swapwindow, u                                                          # Swap tiled window up
bind = $mainMod ALT, down, swapwindow, d                                                        # Swap tiled window down
binde = ALT,Tab,cyclenext                                                                       # Cycle between windows
binde = ALT,Tab,bringactivetotop                                                                # Bring active window to the top  
bind = $mainMod, P, pseudo                                                                      # pseudotiles a window
bind = $mainMod, G, togglegroup                                                                 # Toggle window group

# Windows movement
bind = $mainMod, left, movefocus, l                                                             # Move left
bind = $mainMod, right, movefocus, r                                                            # Move right
bind = $mainMod, up, movefocus, u                                                               # Move up
bind = $mainMod, down, movefocus, d                                                             # Move down
bindm = $mainMod, mouse:272, movewindow                                                         # Move window with the mouse (left button)
bindm = $mainMod, mouse:273, resizewindow                                                       # Resize window with the mouse (right button)
bind = $mainMod SHIFT, right, resizeactive, 100 0                                               # Increase window width with keyboard
bind = $mainMod SHIFT, left, resizeactive, -100 0                                               # Reduce window width with keyboard
bind = $mainMod SHIFT, down, resizeactive, 0 100                                                # Increase window height with keyboard
bind = $mainMod SHIFT, up, resizeactive, 0 -100                                                 # Reduce window height with keyboard

# Special workspaces
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, D, togglespecialworkspace, dev
bind = $mainMod SHIFT, D, movetoworkspace, special:dev

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod CTRL, up, workspace, e+1
bind = $mainMod CTRL, down, workspace, e-1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move to worspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bindd = $mainMod SHIFT, bracketleft, Move to Prev WS, movetoworkspace, -1
bindd = $mainMod SHIFT, bracketright, Move to Next WS, movetoworkspace, +1

# Move to worspace (silent)
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10
bindd = $mainMod CTRL, bracketleft, Move to Prev WS, movetoworkspacesilent, -1
bindd = $mainMod CTRL, bracketright, Move to Next WS, movetoworkspacesilent, +1

# Switch between group of windows
bind = $mainMod SHIFT, right, changegroupactive, f
bind = $mainMod SHIFT, left, changegroupactive, b

# Actions
bind = $mainMod CTRL, R, exec, hyprctl reload                                                   # Reload Hyprland configuration
bind = $mainMod CTRL, L, exec, pidof hyprlock || hyprlock                                       # Lock Screen
bind = $mainMod, PRINT, exec, $screenshot                                                       # Take a screenshot
bind = $mainMod SHIFT, PRINT, exec, $screenshotArea                                             # Take a screenshot

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Cursor Zoom
bindd = $mainMod SHIFT, mouse_down, Zoom Out, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') + 0.7}") # Zoom out
bindd = $mainMod SHIFT, mouse_up, Zoom In, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') - 0.7}") # Zoom in
bind = $mainMod SHIFT, Z, exec, hyprctl keyword cursor:zoom_factor 1 # Reset display zoom

# Swaync
bindd = $mainMod, N, Notification Center, exec, swaync-client -t -sw
